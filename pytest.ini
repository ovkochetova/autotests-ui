[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ui: Запускает все ui тесты
    smoke: Смоук тесты
    registration: Маркировка тестов для регистрации пользователя
    slow: Маркировка медленных тестов
    critical: Критичные тесты
    authorization: Тесты авторизации
    courses: Маркировка для тестов, связанных с курсами
    regression: Маркировка для регрессионных тестов
    dashboard: Маркировка для тестов дешборда

